name: "Docker Build and Push"
description: "Builds a Docker image and optionally pushes it to a registry"
author: "mcp_k8s maintainers"
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Container registry
      if: inputs.push == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Export outputs
      shell: bash
      run: |
        echo "image=${{ inputs.registry }}/${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"
        echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      id: out

inputs:
  registry:
    description: "Container registry hostname (e.g., ghcr.io)"
    required: true
  image-name:
    description: "Image name in the form owner/repo or org/name"
    required: true
  push:
    description: "Whether to push the image"
    required: false
    default: "false"

outputs:
  image:
    description: "Computed image (registry/image-name)"
    value: ${{ steps.out.outputs.image }}
  digest:
    description: "Built image digest"
    value: ${{ steps.out.outputs.digest }}
