name: "Docker Build and Push"
description: "Builds a Docker image and optionally pushes it to a registry"
author: "mcp_k8s maintainers"
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Log in to Container registry
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha

    - name: Build and push
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Export outputs
      shell: bash
      run: |
        echo "image=${{ inputs.registry }}/${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"
        echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      id: out

inputs:
  registry:
    description: "Container registry hostname (e.g., ghcr.io)"
    required: true
  image-name:
    description: "Image name in the form owner/repo or org/name"
    required: true
  push:
    description: "Whether to push the image"
    required: false
    default: "false"

outputs:
  image:
    description: "Computed image (registry/image-name)"
    value: ${{ steps.out.outputs.image }}
  digest:
    description: "Built image digest"
    value: ${{ steps.out.outputs.digest }}
